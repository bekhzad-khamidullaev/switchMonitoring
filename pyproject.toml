[tool.black]
line-length = 100
target-version = ["py311"]
extend-exclude = "migrations"

[tool.isort]
profile = "black"
line_length = 100
skip_glob = ["*/migrations/*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
  ".git",
  ".venv",
  "migrations",
]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.bandit]
exclude_dirs = ["snmp/migrations", "users/migrations", ".venv"]
skips = ["B101"]
