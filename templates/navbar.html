<nav x-data="{mobileOpen:false}" class="border-b border-surface-200 bg-surface-0 shadow-soft">
  <div class="mx-auto flex w-full max-w-[1600px] items-center justify-between px-4 py-3 md:px-6 lg:px-8">
    <a href="{% url 'switches' %}" class="font-display text-lg font-semibold tracking-tight text-surface-900">Switch Monitoring</a>

    <button type="button" class="rounded-md border border-surface-200 px-3 py-1.5 text-sm text-surface-700 md:hidden"
      @click="mobileOpen = !mobileOpen">
      Menu
    </button>

    <div class="hidden items-center gap-2 md:flex">
      <a href="{% url 'switches' %}" class="rounded-md bg-brand-600 px-3 py-2 text-sm font-medium text-white hover:bg-brand-700">Switches</a>
      <a href="{% url 'dashboard' %}" class="rounded-md bg-brand-900 px-3 py-2 text-sm font-medium text-white hover:bg-brand-700">Dashboard</a>
      {% if perms.snmp.change_switch %}
      <a href="{% url 'switch_create' %}" class="rounded-md bg-success-600 px-3 py-2 text-sm font-medium text-white hover:bg-success-700">Add Switch</a>
      {% endif %}
      <span class="rounded-md bg-surface-100 px-3 py-2 text-sm text-surface-700">{{ user.get_full_name|default:user.username }}</span>
      <a href="{% url 'logout' %}" class="rounded-md bg-danger-600 px-3 py-2 text-sm font-medium text-white hover:bg-danger-700">Logout</a>
    </div>
  </div>

  <div x-cloak x-show="mobileOpen" class="border-t border-surface-200 bg-surface-0 px-4 py-3 md:hidden">
    <div class="flex flex-col gap-2">
      <a href="{% url 'switches' %}" class="rounded-md bg-brand-600 px-3 py-2 text-sm font-medium text-white">Switches</a>
      <a href="{% url 'dashboard' %}" class="rounded-md bg-brand-900 px-3 py-2 text-sm font-medium text-white">Dashboard</a>
      {% if perms.snmp.change_switch %}
      <a href="{% url 'switch_create' %}" class="rounded-md bg-success-600 px-3 py-2 text-sm font-medium text-white">Add Switch</a>
      {% endif %}
      <a href="{% url 'logout' %}" class="rounded-md bg-danger-600 px-3 py-2 text-sm font-medium text-white">Logout</a>
    </div>
  </div>
</nav>

<div class="mx-auto mt-4 w-full max-w-[1600px] px-4 md:px-6 lg:px-8">
  <form method="get" class="grid gap-2 sm:grid-cols-[1fr_auto]">
    <input type="text" name="search" value="{{ request.GET.search }}"
      class="w-full rounded-md border border-surface-200 bg-surface-0 px-3 py-2 text-sm text-surface-900 shadow-sm focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-100"
      placeholder="Search by id / hostname / ip / model">
    <button type="submit" class="rounded-md bg-brand-700 px-4 py-2 text-sm font-medium text-white hover:bg-brand-900">Search</button>
  </form>
</div>
