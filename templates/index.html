{% load static %}
<!doctype html>
<html lang="en" class="h-full bg-surface-100">
<head>
  <title>{% block title %}Device Monitoring{% endblock %}</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Sora:wght@600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="{% static 'js/tailwind.config.js' %}"></script>
  <script src="https://unpkg.com/htmx.org@1.9.12"></script>
  <link rel="stylesheet" href="{% static 'css/radix.css' %}">
  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-full bg-surface-100 font-sans text-surface-900">
  {% if user.is_authenticated %}
    {% include 'navbar.html' %}
    <main class="mx-auto w-full max-w-[1600px] px-4 py-4 md:px-6 lg:px-8">
      {% block content %}{% endblock %}
    </main>
  {% else %}
    {% include 'login_page.html' %}
  {% endif %}
  <script src="{% static 'js/sortable-tables.js' %}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
