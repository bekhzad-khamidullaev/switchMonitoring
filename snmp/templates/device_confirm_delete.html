{% extends 'index.html' %}
{% block title %}Delete Device{% endblock %}

{% block content %}
<div class="mx-auto max-w-xl rounded-panel border border-danger-100 bg-surface-0 p-6 shadow-soft text-center">
  <h2 class="font-display text-xl font-semibold text-surface-900">Delete Device</h2>
  <p class="mt-4">Are you sure you want to delete device "{{ device.hostname }}"?</p>
  <form method="post" class="mt-4 flex justify-center items-center" action="{% url 'device_delete' device.pk %}">
    {% csrf_token %}
    <button type="submit" class="focus:outline-none text-white bg-danger-600 hover:bg-danger-700 focus:ring-4 focus:ring-danger-200 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2">Delete</button>
    <a href="{% url 'device_detail' device.pk %}" class="focus:outline-none text-surface-900 bg-warning-300 hover:bg-warning-200 focus:ring-4 focus:ring-warning-200 font-medium rounded-lg text-sm px-5 py-2.5 me-2 mb-2">Cancel</a>
  </form>
</div>
{% endblock %}
