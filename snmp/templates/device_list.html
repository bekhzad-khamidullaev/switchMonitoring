{% extends "index.html" %}
{% block title %}Devices{% endblock %}

{% block content %}
  <div class="mb-4 rounded-panel border border-surface-200 bg-surface-0 p-4 shadow-soft">
    <form method="get" class="grid grid-cols-1 items-center gap-2 md:grid-cols-[minmax(260px,1fr)_140px_180px_180px_auto_auto]">
      <input
        id="search"
        type="text"
        name="search"
        value="{{ selected_search }}"
        class="w-full rounded-md border border-surface-200 bg-surface-0 px-3 py-2 text-sm text-surface-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-100"
        placeholder="Search: ID / hostname / ip / model"
      >

      <select id="status" name="status" class="rounded-md border border-surface-200 bg-surface-0 px-3 py-2 text-sm text-surface-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-100">
        <option value="">Status: all</option>
        <option value="up" {% if selected_status == 'up' %}selected{% endif %}>Status: UP</option>
        <option value="down" {% if selected_status == 'down' %}selected{% endif %}>Status: DOWN</option>
      </select>

      <select id="branch" name="branch" class="rounded-md border border-surface-200 bg-surface-0 px-3 py-2 text-sm text-surface-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-100">
        <option value="">Branch: all</option>
        {% for branch in branch_options %}
          <option value="{{ branch.id }}" {% if selected_branch == branch.id|stringformat:"s" %}selected{% endif %}>{{ branch.name|default:'-' }}</option>
        {% endfor %}
      </select>

      <select id="vendor" name="vendor" class="rounded-md border border-surface-200 bg-surface-0 px-3 py-2 text-sm text-surface-900 focus:border-brand-500 focus:outline-none focus:ring-2 focus:ring-brand-100">
        <option value="">Vendor: all</option>
        {% for vendor in vendor_options %}
          <option value="{{ vendor.model__vendor_id }}" {% if selected_vendor == vendor.model__vendor_id|stringformat:"s" %}selected{% endif %}>{{ vendor.model__vendor__name }}</option>
        {% endfor %}
      </select>

      <button type="submit" class="rounded-md bg-brand-700 px-4 py-2 text-sm font-medium text-white hover:bg-brand-900">Apply</button>
      <a href="{% url 'devices' %}" class="rounded-md border border-surface-200 bg-surface-0 px-4 py-2 text-sm font-medium text-surface-900 hover:bg-surface-50">Reset</a>
    </form>
  </div>
  {% include 'partials/device_table.html' with devices_page=devices page_title='All Devices' page_subtitle='Inventory and live status overview' %}
{% endblock %}
